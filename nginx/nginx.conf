# Minimal reverse proxy (enable with: docker compose --profile with-nginx up -d)
# Place TLS certs in nginx/certs/ if using HTTPS later.

events {
    worker_connections 1024;
}

http {
    upstream assistant {
        server assistant:8080;
    }
    upstream n8n {
        server n8n:5678;
    }
    upstream parser {
        server parser-api:8000;
    }

    server {
        listen 80;
        server_name _;

        location /n8n/ {
            proxy_pass http://n8n/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /parser/ {
            proxy_pass http://parser/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            proxy_pass http://assistant;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
